<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Favicon: a MESMA marca do componente, sem versão reduzida.

    Até 2026-07-26 este arquivo divergia de propósito: o componente tinha órbita e
    planeta, e aqui só entrava a estrela, porque a 16px aqueles detalhes viram borrão.
    O preço era ter duas marcas para o mesmo produto, divergindo em silêncio. A marca
    passou a ser uma forma só — então favicon e componente voltaram a ser o mesmo
    desenho, e o portão check-atlas-logo passou a poder exigir exatamente isso.

    Enquadramento calculado, não tentado: a estrela ocupa x 14→86 e y 3→97 na caixa
    de 100. Com escala s, centralizá-la exige translate = 32 - 50s nos dois eixos.
    Com s = 0.46 ela fica 33,1 × 43,2 numa arte de 64 — cerca de 68% da altura,
    proporção em que uma marca vertical respira dentro do quadrado sem encostar nas
    bordas.
  -->
  <defs>
    <linearGradient id="atlasIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ae7d7"/>
      <stop offset="1" stop-color="#8b8cff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#06080f"/>
  <g transform="translate(9 9) scale(0.46)">
    <path d="M50,3 Q53.5,46.5 86,50 Q53.5,53.5 50,97 Q46.5,53.5 14,50 Q46.5,46.5 50,3 Z" fill="url(#atlasIconGrad)"/>
  </g>
</svg>
