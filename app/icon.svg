<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Favicon: a MESMA marca do componente, sem versão reduzida.

    A geometria vem de components/atlas/atlas-logo.tsx (ATLAS_MONOGRAM_PATH e
    ATLAS_CROSSBAR). Duas cópias divergem em silêncio — foi o que aconteceu
    quando o componente tinha órbita e planeta e aqui só entrava a estrela. O
    portão check-atlas-logo compara os dois desenhos e reprova se diferirem.

    Enquadramento calculado, não tentado: o monograma ocupa x 12→88 (76 unidades)
    e y 8→92 (84) na caixa de 100. Com escala s, centralizá-lo exige
    translate = 32 - 50s nos dois eixos. Com s = 0.53 ele fica 40,3 × 44,5 numa
    arte de 64 — cerca de 70% da altura, proporção em que uma marca respira
    dentro do quadrado sem encostar nas bordas.

    O <g> envolve as duas formas porque o travessão precisa da MESMA transformação
    do contorno; transformá-los separadamente seria a porta para eles se
    desalinharem numa edição futura.
  -->
  <defs>
    <linearGradient id="atlasIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ae7d7"/>
      <stop offset="1" stop-color="#8b8cff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#06080f"/>
  <g transform="translate(5.5 5.5) scale(0.53)">
    <path d="M44,8 L56,8 L88,92 L68,92 L50,50 L32,92 L12,92 Z" fill="url(#atlasIconGrad)"/>
    <rect x="34" y="64" width="32" height="12" rx="2" fill="url(#atlasIconGrad)"/>
  </g>
</svg>
