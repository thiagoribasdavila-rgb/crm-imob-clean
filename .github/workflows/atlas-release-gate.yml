name: Atlas V3 Release Gate

on:
  pull_request:
    branches:
      - atlas-v3-build
      - main
  push:
    branches:
      - atlas-v3-auth
      - atlas-v3-build
      # O trabalho acontece em `claude/**` e o CI nunca disparava nele: os
      # gatilhos listavam tres branches, nenhuma delas a de entrega. Um portao
      # que so roda onde ninguem trabalha e um portao que nao existe.
      - 'claude/**'

concurrency:
  group: atlas-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Mesma versao do .nvmrc. Estavam divergentes (24 aqui, 22 la) — duas
          # verdades sobre em que Node este produto roda. E `engines` agora
          # recusa Node 26, que foi decisao do dono do produto.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tarifa de IA para o CI MEDIR de verdade.
      #
      # `ai:pricing:check` reprovava com "ATLAS_AI_PRICE_TABLE ausente. Todo
      # consumo de IA será gravado com custo NULO." — vermelho legítimo, mas
      # causado por ausência de configuração NO CI, não por defeito do código.
      #
      # O valor NÃO é segredo (tarifa pública de provedor) e NÃO é digitado
      # aqui: sai de config/ai-price-table.referencia.json, versionado e
      # derivado de .env.production.example, que registra a data da conferência.
      #
      # Isto não afrouxa o portão. Ausência e JSON inválido continuam
      # reprovando, aqui e em produção — `contrato: tarifa de IA` prova os dois
      # casos. Produção declara a tarifa vigente na variável de ambiente do
      # servidor; este arquivo nunca é lido em tempo de execução.
      - name: Tarifa de IA (referência versionada)
        run: |
          set -euo pipefail
          TABELA="$(node -e 'process.stdout.write(JSON.stringify(require("./config/ai-price-table.referencia.json").tarifas))')"
          test -n "$TABELA"
          echo "ATLAS_AI_PRICE_TABLE=$TABELA" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Enterprise architecture check
        run: npm run enterprise:check

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-errors.txt

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-typescript-diagnostics
          path: typecheck-errors.txt
          if-no-files-found: error

      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome != 'success'
        run: exit 1

      - name: ESLint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-errors.txt

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-level6-lint-diagnostics
          path: lint-errors.txt
          if-no-files-found: error

      - name: Fail on lint errors
        if: steps.lint.outcome != 'success'
        run: exit 1

      - name: Contratos
        run: npm run test:contracts

      - name: Portoes
        # A bateria inteira. Os que dependem de ambiente saem com NAO EXECUTADO
        # e sao contados como quarentena declarada — nunca verdes por ausencia.
        run: npm run portoes:todos

      - name: Production build
        run: npm run build
